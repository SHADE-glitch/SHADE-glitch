name: profile

# Guards the front page: a dead link, a half-mirrored README, a private repo that slipped in, or an
# AGENTS.md §6 index out of sync with the README should never reach github.com/SHADE-glitch.
# See AGENTS.md and scripts/check-profile.mjs.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the README + AGENTS.md (structure, mirror, links, visibility, index)
        env:
          # Every listed repo must be public, so the default token sees them all. No PAT is needed:
          # a repo the token cannot see fails the visibility check instead of hiding behind a secret
          # (see AGENTS.md §1 and §5).
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-profile.mjs
