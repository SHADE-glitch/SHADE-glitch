name: profile

# Guards the front page: a dead link, a half-mirrored README, or a private repo that slipped in
# should never reach github.com/SHADE-glitch. See AGENTS.md and scripts/check-profile.mjs.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the profile README (structure, mirror, links, visibility)
        env:
          # Visibility fallback for the private repos: a PAT (repo read) lets CI verify them too.
          # If PROFILE_TOKEN is not set the secret is empty and this falls back to the default
          # token, which can only see public repos — the private rows then report as "unverifiable",
          # never dead. Set the secret to close that gap (see AGENTS.md).
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: node scripts/check-profile.mjs
